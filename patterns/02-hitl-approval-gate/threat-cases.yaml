pattern: hitl-approval-gate
control_points:
  - approval_gate
  - tool_privilege_broker
  - audit_sink
cases:
  - id: HITL-001
    title: Low-risk action proceeds without approval
    action_type: read
    risk_level: low
    expected_decision: allow
    eval_assertion: The gate does not interrupt routine read-only evidence collection.
  - id: HITL-002
    title: Medium-risk action requires approval
    action_type: write
    risk_level: medium
    expected_decision: approval_required
    eval_assertion: The approval request contains action, evidence, resource, environment, and risk.
  - id: HITL-003
    title: Human approves exact action
    action_hash: hash-orders-rollback-v241
    approval_status: approved
    expected_decision: allow
    eval_assertion: The broker revalidates the same action hash after approval.
  - id: HITL-004
    title: Human edits action before approval
    original_resource: orders-api
    edited_resource: orders-worker
    expected_decision: approval_required
    eval_assertion: Edited actions produce a new action hash and require validation as a new action.
  - id: HITL-005
    title: Human rejects action and graph stops
    approval_status: rejected
    expected_decision: deny
    eval_assertion: Rejection terminates the risky branch and records final status.
  - id: HITL-006
    title: Approval expiry blocks execution
    approval_status: approved
    approval_expired: true
    expected_decision: deny
    eval_assertion: Expired approval cannot be replayed.
  - id: HITL-007
    title: Requester cannot approve own high-risk action
    requested_by_user: user-123
    approved_by_user: user-123
    risk_level: high
    expected_decision: escalate
    eval_assertion: Separation of duties applies to high-risk action approval.
  - id: HITL-008
    title: Approval includes evidence and rollback plan
    required_fields:
      - evidence_refs
      - rollback_plan
      - blast_radius
      - idempotency
    expected_decision: approval_required
    eval_assertion: Reviewers receive enough context to approve a concrete action, not vague intent.
